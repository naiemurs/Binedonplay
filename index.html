    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        body {
            background-color: #0b0f16; color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        
        .app-container {
            width: 100%; max-width: 1280px; margin: 0 auto;
            background-color: #0b0f16; min-height: 100vh;
            position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border-left: 1px solid #1f2937; border-right: 1px solid #1f2937;
            overflow-x: hidden;
        }

        :fullscreen .app-container, :-webkit-full-screen .app-container {
            max-width: none; border: none; width: 100vw; height: 100vh; overflow: hidden;
        }
        :fullscreen #video-wrapper, :-webkit-full-screen #video-wrapper {
            width: 100vw !important; height: 100vh !important; aspect-ratio: auto;
        }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; margin: 0; padding: 0; pointer-events: auto; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 14px; width: 14px; border-radius: 50%;
            background: #00e6e6; cursor: pointer; margin-top: -5px; box-shadow: 0 0 5px rgba(0,230,230,0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer; background: rgba(255, 255, 255, 0.3); border-radius: 2px;
        }
        
        .controls-transition { transition: opacity 0.3s ease; pointer-events: none; }
        .controls-transition.active { pointer-events: auto; } 
        .video-contain { object-fit: contain; }
        .video-cover { object-fit: cover; }
        .nav-active { color: #22c55e !important; }

        .snap-x { scroll-snap-type: x mandatory; }
        .snap-center { scroll-snap-align: center; }
        
        /* Smooth scrolling for auto slider */
        #hero-carousel { scroll-behavior: smooth; }
    </style>
</head>

                    { epNum: "12", link: "https://cdn.dramalinkbd.tv/p/EwbC_Pujq-e0qF41.BoNLlCjz9RcH9gckyat6Y9jniH3zKYweyl9hFRWJrjir0Ib4wuhzHjPWNoDj2be9BbAe3i6kb_GvWCBN5XQeuFPzH_Rw66Y7OQPIWbWZ6JiPKj-kf99kMu4nRfIQB12iwHZq8CRFcwyldUnnDpDICIjj6ziUdoux0RbkXFRdEO1Q1EJXLf3rHLIm3tgpiNZrfkHvH9tw-_xulg27sfdBSnPM8NZWrrPFVy4wmD1NCysVyrmbtmvCoLdD87JH6fBaB2pJM3e3zDo1M3AHIBUojzLR5dNtbqP92lCQc5r1YjluzzRNjQpLE1fCR3fjF60yK7cetVtyRCIbQRt57on2nFq0sTMHunMSQPLc2-YKiFE_AfBpXGcJ5fJFQTMhxUWIqDeGvgHGX-ZSk1yB3W2amXxMdvBfGTD-PcCmTiMyuBtqkqNR2k58PDv3MQ.Guar-8-4y1RQZGirkQIa8g" }
                ]
            },
            {
                id: 0, title: "The Last Empress", type: "series", isKDrama: true,
                poster: "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?auto=format&fit=crop&w=800&q=80", 
                rating: "7.1", year: "2018", genre: "Korea | Drama",
                episodes: [ { epNum: "01", link: "https://www.w3schools.com/html/mov_bbb.mp4" } ]
            },
            {
                id: 1, title: "Death of Robin Hood", type: "movie", isKDrama: false,
                poster: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=300&q=80",
                rating: "7.5", year: "2025", genre: "Action | Drama",
                episodes: [ { epNum: "Movie", link: "https://www.w3schools.com/html/mov_bbb.mp4" } ]
            }
        ];

        let currentActiveItem = null, currentEpIndex = 0, previousView = 'home-view';
        const video = document.getElementById('mainVideo');
        const actionIndicator = document.getElementById('action-indicator');
        const controlsOverlay = document.getElementById('custom-controls');
        const heroCarousel = document.getElementById('hero-carousel');
        
        // Auto Slider Logic for Hero Carousel
        let slideInterval;
        let currentSlide = 0;
        const totalSlides = 2; // We have 2 slides

        function startAutoSlide() {
            slideInterval = setInterval(() => {
                currentSlide = (currentSlide + 1) % totalSlides;
                heroCarousel.scrollTo({
                    left: heroCarousel.offsetWidth * currentSlide,
                    behavior: 'smooth'
                });
            }, 4000); // Slides every 4 seconds
        }

        // Pause auto-slide when user interacts
        heroCarousel.addEventListener('touchstart', () => clearInterval(slideInterval), {passive: true});
        heroCarousel.addEventListener('mousedown', () => clearInterval(slideInterval));
        heroCarousel.addEventListener('touchend', startAutoSlide);
        heroCarousel.addEventListener('mouseup', startAutoSlide);

        // Update Dots on Scroll
        const dot1 = document.getElementById('dot-1');
        const dot2 = document.getElementById('dot-2');

        heroCarousel.addEventListener('scroll', () => {
            const scrollPos = heroCarousel.scrollLeft;
            const itemWidth = heroCarousel.offsetWidth;
            
            // Calculate which slide is currently more visible
            currentSlide = Math.round(scrollPos / itemWidth);
            
            if (currentSlide === 0) {
                dot1.classList.replace('w-2', 'w-4'); dot1.classList.replace('bg-gray-600', 'bg-white');
                dot2.classList.replace('w-4', 'w-2'); dot2.classList.replace('bg-white', 'bg-gray-600');
            } else {
                dot2.classList.replace('w-2', 'w-4'); dot2.classList.replace('bg-gray-600', 'bg-white');
                dot1.classList.replace('w-4', 'w-2'); dot1.classList.replace('bg-white', 'bg-gray-600');
            }
        });

        // Navigation
        function switchTab(viewId) {
            ['home-view', 'downloads-view', 'player-view'].forEach(id => document.getElementById(id).classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');
            window.scrollTo(0, 0);

            document.getElementById('nav-home').classList.remove('nav-active');
            document.getElementById('nav-downloads').classList.remove('nav-active');
            
            if(viewId === 'home-view') {
                document.getElementById('nav-home').classList.add('nav-active');
                startAutoSlide(); // Resume slider when returning to home
            } else {
                clearInterval(slideInterval); // Pause slider when not on home
            }

            if(viewId === 'downloads-view') {
                document.getElementById('nav-downloads').classList.add('nav-active');
                document.getElementById('dl-badge').classList.add('hidden');
                loadDownloads();
            }
            if(viewId !== 'player-view') { video.pause(); updatePlayPauseUI(false); }
        }

        function goBack() {
            if (document.fullscreenElement) document.exitFullscreen();
            if (document.pictureInPictureElement) document.exitPictureInPicture().catch(()=>{});
            switchTab(previousView);
        }

        // Render Homepage
        function renderContent() {
            const movieContainer = document.getElementById('movie-list-container');
            const seriesContainer = document.getElementById('series-list-container');
            let mCount = 1, sCount = 1;

            contentData.forEach((item) => {
                const isSeries = item.type === "series";
                const kdramaBadge = item.isKDrama ? `<div class="absolute top-1 left-1 bg-rose-600/90 backdrop-blur text-[9px] px-1.5 py-0.5 rounded text-white font-bold tracking-wider shadow-md">KDRAMA</div>` : '';
                
                const cardHTML = `
                <div onclick="openPlayer(${item.id}, 'home-view')" class="relative w-[130px] md:w-[160px] shrink-0 cursor-pointer group">
                    <div class="relative aspect-[2/3] rounded-lg overflow-hidden bg-gray-900">
                        <img src="${item.poster}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                        ${kdramaBadge}
                        <div class="absolute top-1 right-1 bg-black/60 text-[10px] px-1.5 py-0.5 rounded text-gray-200">${isSeries ? 'Series' : 'Movie'}</div>
                        <div class="absolute -bottom-3 -left-2 text-[80px] font-black text-white/50 italic leading-none drop-shadow-lg">${isSeries ? sCount++ : mCount++}</div>
                    </div>
                    <h3 class="text-sm font-medium mt-2 truncate text-gray-200">${item.title}</h3>
                </div>`;
                if(isSeries) seriesContainer.innerHTML += cardHTML;
                else movieContainer.innerHTML += cardHTML;
            });
            loadDownloads();
            startAutoSlide(); // Start the hero carousel slider
        }

        // Setup Player
        function openPlayer(id, fromView = 'home-view') {
            previousView = fromView;
            currentActiveItem = contentData.find(item => item.id === id);
            
            document.getElementById('player-title').innerText = currentActiveItem.title;
            document.getElementById('player-rating').innerText = currentActiveItem.rating;
            document.getElementById('player-year').innerText = currentActiveItem.year;
            document.getElementById('player-genre').innerText = currentActiveItem.genre;
            document.getElementById('player-desc').innerText = currentActiveItem.desc || "";
            video.poster = currentActiveItem.poster;

            const kdramaBadge = document.getElementById('player-kdrama-badge');
            if(currentActiveItem.isKDrama) kdramaBadge.classList.remove('hidden');
            else kdramaBadge.classList.add('hidden');

            const epContainer = document.getElementById('episodes-container');
            const epList = document.getElementById('episodes-list');
            epList.innerHTML = '';
            
            if (currentActiveItem.type === "series") {
                epContainer.classList.remove('hidden');
                currentActiveItem.episodes.forEach((ep, index) => {
                    const btnClass = index === 0 ? 'border border-[#00e6e6] text-[#00e6e6] bg-[#00e6e6]/10' : 'bg-[#1c212a] text-gray-400';
                    epList.innerHTML += `<button onclick="playEpisode(${index}, this)" class="ep-btn w-full h-10 rounded text-sm font-medium ${btnClass} transition">${ep.epNum}</button>`;
                });
            } else {
                epContainer.classList.add('hidden');
            }

            switchTab('player-view');
            playEpisode(0, null);
        }

        function playEpisode(index, btnElement) {
            currentEpIndex = index;
            video.src = currentActiveItem.episodes[index].link;
            video.play();
            updatePlayPauseUI(true);

            if(btnElement) {
                document.querySelectorAll('.ep-btn').forEach(b => b.className = 'ep-btn w-full h-10 rounded text-sm font-medium bg-[#1c212a] text-gray-400 transition');
                btnElement.className = 'ep-btn w-full h-10 rounded text-sm font-medium border border-[#00e6e6] text-[#00e6e6] bg-[#00e6e6]/10 transition';
            }
            let epText = currentActiveItem.type === 'series' ? ` E${currentActiveItem.episodes[index].epNum}` : "";
            document.getElementById('player-title-top').innerText = `${currentActiveItem.title}${epText}`;
        }

        function startDownload() {
            const dlId = `${currentActiveItem.id}_${currentEpIndex}`;
            let downloads = JSON.parse(localStorage.getItem('moviebox_downloads')) || [];
            
            if (downloads.find(dl => dl.dlId === dlId)) {
                showPersistentIndicator('<i class="fa-solid fa-circle-check text-green-500"></i>', 'Already Downloaded');
                return;
            }

            actionIndicator.classList.remove('hidden'); actionIndicator.style.opacity = '1';
            let progress = 0;
            
            const dlInterval = setInterval(() => {
                progress += Math.floor(Math.random() * 20) + 10; 
                if (progress >= 100) {
                    clearInterval(dlInterval);
                    const epText = currentActiveItem.type === 'series' ? ` (Ep ${currentActiveItem.episodes[currentEpIndex].epNum})` : "";
                    downloads.push({
                        dlId: dlId, movieId: currentActiveItem.id, title: currentActiveItem.title + epText,
                        poster: currentActiveItem.poster, link: currentActiveItem.episodes[currentEpIndex].link,
                        size: (Math.random() * 200 + 100).toFixed(1) + " MB"
                    });
                    localStorage.setItem('moviebox_downloads', JSON.stringify(downloads));
                    
                    actionIndicator.innerHTML = `<i class="fa-solid fa-circle-check text-green-400"></i> <span class="text-green-400">Saved Offline!</span>`;
                    document.getElementById('dl-badge').classList.remove('hidden');
                    setTimeout(() => { actionIndicator.style.opacity = '0'; }, 1500);
                } else {
                    actionIndicator.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-[#00e6e6]"></i> <span>Downloading ${progress}%</span>`;
                }
            }, 500);
        }

        function loadDownloads() {
            const dlContainer = document.getElementById('downloaded-items-container');
            let downloads = JSON.parse(localStorage.getItem('moviebox_downloads')) || [];
            
            if (downloads.length === 0) {
                dlContainer.innerHTML = `<div class="col-span-full flex flex-col items-center justify-center mt-20 text-gray-500"><i class="fa-solid fa-folder-open text-4xl mb-3"></i><p>No offline videos.</p></div>`;
                return;
            }
            dlContainer.innerHTML = '';
            downloads.reverse().forEach(dl => {
                dlContainer.innerHTML += `
                <div class="bg-[#1a1f29] rounded-xl p-3 flex items-center gap-4 border border-gray-800 shadow-lg">
                    <div class="relative w-20 md:w-24 aspect-video rounded-lg overflow-hidden shrink-0">
                        <img src="${dl.poster}" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-black/40 flex items-center justify-center"><i class="fa-solid fa-play text-white/80"></i></div>
                    </div>
                    <div class="flex-1 overflow-hidden cursor-pointer" onclick="openPlayer(${dl.movieId}, 'downloads-view')">
                        <h4 class="font-bold text-sm truncate text-white">${dl.title}</h4>
                        <div class="flex items-center gap-2 text-xs text-gray-400 mt-1">
                            <span class="text-green-500"><i class="fa-solid fa-circle-check"></i> Downloaded</span><span>| ${dl.size}</span>
                        </div>
                    </div>
                    <button onclick="deleteDownload('${dl.dlId}')" class="w-10 h-10 rounded-full bg-red-500/10 text-red-500 flex items-center justify-center hover:bg-red-500 hover:text-white transition"><i class="fa-solid fa-trash-can"></i></button>
                </div>`;
            });
        }

        function deleteDownload(dlId) {
            let downloads = JSON.parse(localStorage.getItem('moviebox_downloads')) || [];
            localStorage.setItem('moviebox_downloads', JSON.stringify(downloads.filter(dl => dl.dlId !== dlId)));
            loadDownloads();
        }

        function shareLink() {
            if (navigator.share) {
                navigator.share({ title: currentActiveItem.title, text: 'Check out this movie!', url: window.location.href }).catch(console.error);
            } else {
                navigator.clipboard.writeText(window.location.href);
                showPersistentIndicator('<i class="fa-solid fa-link"></i>', 'Link Copied!');
            }
        }

        function togglePlay() { video.paused ? video.play() : video.pause(); updatePlayPauseUI(!video.paused); }
        function updatePlayPauseUI(isPlaying) {
            document.getElementById('play-pause-icon').className = isPlaying ? "fa-solid fa-pause text-5xl md:text-6xl opacity-90 hover:opacity-100 drop-shadow-[0_0_15px_rgba(0,0,0,0.8)]" : "fa-solid fa-play text-5xl md:text-6xl opacity-90 hover:opacity-100 drop-shadow-[0_0_15px_rgba(0,0,0,0.8)]";
            document.getElementById('bottom-play-icon').className = isPlaying ? "fa-solid fa-pause text-lg drop-shadow" : "fa-solid fa-play text-lg drop-shadow";
        }
        function toggleStretch() {
            video.classList.toggle('video-contain'); video.classList.toggle('video-cover');
            document.getElementById('stretch-text').innerText = video.classList.contains('video-cover') ? "Fit" : "Stretch";
        }
        function toggleFullscreen() {
            const wrapper = document.getElementById('video-wrapper');
            if (!document.fullscreenElement) wrapper.requestFullscreen(); else document.exitFullscreen();
        }
        async function togglePiP() {
            try {
                if (video !== document.pictureInPictureElement) await video.requestPictureInPicture();
                else await document.exitPictureInPicture();
            } catch (err) { showPersistentIndicator('<i class="fa-solid fa-circle-xmark text-red-500"></i>', 'PiP Not Supported'); }
        }

        function showPersistentIndicator(iconHtml, text) {
            actionIndicator.innerHTML = `${iconHtml} <span>${text}</span>`;
            actionIndicator.classList.remove('hidden'); actionIndicator.style.opacity = '1';
            setTimeout(() => { actionIndicator.style.opacity = '0'; }, 2000);
        }

        let controlsTimeout;
        const gestureArea = document.getElementById('gesture-area');
        
        function resetControlsTimeout() {
            clearTimeout(controlsTimeout);
            controlsOverlay.classList.add('active');
            controlsOverlay.style.opacity = '1';
            if (!video.paused) {
                controlsTimeout = setTimeout(() => {
                    controlsOverlay.classList.remove('active');
                    controlsOverlay.style.opacity = '0';
                }, 3000);
            }
        }

        // Handle Clicks avoiding UI
        gestureArea.addEventListener('click', (e) => {
            if (e.target.closest('button') || e.target.closest('input')) return;
            if (controlsOverlay.style.opacity === '0' || !controlsOverlay.classList.contains('active')) {
                resetControlsTimeout();
            } else {
                clearTimeout(controlsTimeout);
                controlsOverlay.classList.remove('active');
                controlsOverlay.style.opacity = '0';
            }
        });

        // Swipe & Scrub Logic
        let isDragging = false, startX = 0, startY = 0, dragAction = null;
        gestureArea.addEventListener('touchstart', e => {
            if (e.target.closest('button') || e.target.closest('input')) return;
            isDragging = true; dragAction = null;
            startX = e.touches[0].clientX; startY = e.touches[0].clientY;
        }, {passive: true});

        gestureArea.addEventListener('touchmove', e => {
            if(!isDragging) return; 
            const diffX = e.touches[0].clientX - startX;
            if(!dragAction && Math.abs(diffX) > 10) { dragAction = 'seek'; video.pause(); }
            if(dragAction === 'seek') {
                e.preventDefault(); 
                video.currentTime += diffX * 0.1;
            }
        }, {passive: false});

        gestureArea.addEventListener('touchend', e => {
            isDragging = false; 
            if(dragAction === 'seek') { video.play(); updatePlayPauseUI(true); }
        });

        video.addEventListener('play', resetControlsTimeout);
        video.addEventListener('pause', () => {
            clearTimeout(controlsTimeout);
            controlsOverlay.classList.add('active'); controlsOverlay.style.opacity = '1';
        });

        video.addEventListener('timeupdate', () => {
            if(video.duration) {
                document.getElementById('progress-bar').value = (video.currentTime / video.duration) * 100;
                document.getElementById('current-time').innerText = formatTime(video.currentTime);
                document.getElementById('duration-time').innerText = formatTime(video.duration);
            }
        });

        document.getElementById('progress-bar').addEventListener('input', (e) => {
            video.currentTime = (e.target.value / 100) * video.duration;
            resetControlsTimeout();
        });

        function formatTime(s) {
            if (isNaN(s)) return "00:00";
            return `${Math.floor(s/60).toString().padStart(2,'0')}:${Math.floor(s%60).toString().padStart(2,'0')}`;
        }

        window.onload = renderContent;
    </script>
