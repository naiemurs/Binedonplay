<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudStream Extensions</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0f0f0f',
                        darkCard: '#1a1a1a',
                    }
                }
            }
        }
    </script>
    <!-- Phosphor Icons (for download icon) -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { background-color: #0f0f0f; color: white; }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #0f0f0f; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body class="font-sans antialiased pb-20">
    
    <!-- Top Header (App Bar) -->
    <header class="sticky top-0 z-20 bg-darkBg/90 backdrop-blur-md border-b border-white/10 px-4 py-3 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <i class="ph ph-arrow-left text-2xl cursor-pointer hover:text-gray-300"></i>
            <div>
                <h1 id="repo-name" class="text-xl font-medium">লোড হচ্ছে...</h1>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <div id="search-btn" class="cursor-pointer">
                <i class="ph ph-magnifying-glass text-2xl hover:text-gray-300"></i>
            </div>
            <i class="ph ph-globe text-2xl hover:text-gray-300"></i>
        </div>
    </header>

    <!-- Search Bar (Hidden by default) -->
    <div id="search-container" class="hidden px-4 py-2 bg-darkCard border-b border-white/10">
        <input type="text" id="search-input" placeholder="Search..." class="w-full bg-transparent outline-none text-white placeholder-gray-500 py-1">
    </div>

    <!-- Category Tabs -->
    <div class="flex overflow-x-auto gap-6 px-4 py-3 border-b border-white/5 text-sm font-medium text-gray-400 no-scrollbar whitespace-nowrap">
        <span class="text-white border-b-2 border-white pb-1 cursor-pointer">All</span>
        <span class="cursor-pointer hover:text-gray-200">Movies</span>
        <span class="cursor-pointer hover:text-gray-200">TV Series</span>
        <span class="cursor-pointer hover:text-gray-200">Anime</span>
        <span class="cursor-pointer hover:text-gray-200">Asian Drama</span>
    </div>

    <!-- Main List Container -->
    <main class="max-w-3xl mx-auto mt-2">
        
        <!-- Loading Indicator -->
        <div id="loading" class="flex flex-col items-center justify-center py-20">
            <div class="w-8 h-8 border-4 border-blue-500 border-t-transparent rounded-full animate-spin"></div>
        </div>

        <!-- Error Message -->
        <div id="error-container" class="hidden text-center py-10 text-red-400">
            <p id="error-message"></p>
        </div>

        <!-- Plugins List -->
        <div id="plugin-list" class="hidden flex flex-col">
            <!-- Cards will be injected here -->
        </div>
        
    </main>

    <!-- Bottom Install Button (Floating like the video) -->
    <div class="fixed bottom-4 left-0 right-0 flex justify-center z-30 pointer-events-none">
        <a id="install-btn" href="#" class="pointer-events-auto hidden items-center gap-2 bg-[#2a2a2a] hover:bg-[#333] text-gray-300 px-6 py-2.5 rounded-full text-sm shadow-lg border border-white/10 transition-colors">
            <i class="ph ph-cloud-arrow-down text-lg"></i>
            <span id="repo-name-btn">Install Repo</span>
        </a>
    </div>

    <script>
        const REPO_URL = 'https://raw.githubusercontent.com/phisher98/cloudstream-extensions-phisher/refs/heads/builds/repo.json';
        let globalPlugins = [];

        async function fetchJSON(url) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Direct fetch failed');
                return await response.json();
            } catch (error) {
                const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(url);
                const proxyResponse = await fetch(proxyUrl);
                if (!proxyResponse.ok) throw new Error('Proxy fetch failed');
                return await proxyResponse.json();
            }
        }

        async function loadRepository() {
            const loadingEl = document.getElementById('loading');
            const listEl = document.getElementById('plugin-list');
            const installBtn = document.getElementById('install-btn');
            
            try {
                const repoData = await fetchJSON(REPO_URL);
                
                document.getElementById('repo-name').textContent = repoData.name || 'Repository';
                document.getElementById('repo-name-btn').textContent = `Install ${repoData.name || 'Repo'}`;
                
                const cloudstreamDeepLink = REPO_URL.replace(/^https?:\/\//, 'cloudstreamrepo://');
                installBtn.href = cloudstreamDeepLink;
                installBtn.classList.remove('hidden');
                installBtn.classList.add('flex');

                let allPlugins = [];
                if (repoData.pluginLists && Array.isArray(repoData.pluginLists)) {
                    for (const listUrl of repoData.pluginLists) {
                        try {
                            const pluginsData = await fetchJSON(listUrl);
                            if (Array.isArray(pluginsData)) {
                                allPlugins = allPlugins.concat(pluginsData);
                            }
                        } catch (err) {
                            console.error(`Failed to load list: ${listUrl}`);
                        }
                    }
                }

                globalPlugins = allPlugins;
                renderPlugins(allPlugins);

                loadingEl.classList.add('hidden');
                listEl.classList.remove('hidden');

            } catch (error) {
                loadingEl.classList.add('hidden');
                document.getElementById('error-container').classList.remove('hidden');
                document.getElementById('error-message').textContent = 'Failed to load repository.';
            }
        }

        function renderPlugins(plugins) {
            const list = document.getElementById('plugin-list');
            list.innerHTML = ''; 

            plugins.forEach(plugin => {
                const fallbackImage = `https://placehold.co/100x100/2a2a2a/ffffff?text=${plugin.name.charAt(0)}`;
                const langIcon = plugin.language ? '🌐' : '🇬🇧'; // Simple placeholder for language flags
                const langText = plugin.language || 'English';
                const fileSize = Math.floor(Math.random() * 80) + 15; // Mock file size since it's not in JSON usually
                
                const item = document.createElement('div');
                item.className = 'flex items-center justify-between px-4 py-3 hover:bg-white/5 cursor-pointer transition-colors border-b border-white/5';
                item.innerHTML = `
                    <div class="flex items-center gap-4 overflow-hidden">
                        <img src="${plugin.iconUrl || fallbackImage}" 
                             onerror="this.src='${fallbackImage}'" 
                             class="w-10 h-10 rounded shadow-sm object-cover bg-[#2a2a2a] flex-shrink-0" 
                             alt="icon">
                        <div class="flex flex-col min-w-0">
                            <span class="font-semibold text-[15px] truncate">${plugin.name}</span>
                            <div class="flex items-center gap-1.5 text-xs text-gray-400 mt-0.5">
                                <span>${langIcon} ${langText}</span>
                                <span>•</span>
                                <span>v${plugin.version}</span>
                                <span>•</span>
                                <span>${fileSize} kB</span>
                            </div>
                            <span class="text-xs text-gray-500 truncate mt-0.5">${plugin.description || 'Extension'}</span>
                        </div>
                    </div>
                    <div class="pl-4">
                        <a href="cloudstreamrepo://${REPO_URL.replace(/^https?:\/\//, '')}" class="text-gray-300 hover:text-white p-2">
                            <i class="ph ph-download-simple text-xl"></i>
                        </a>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        // Search Toggle
        document.getElementById('search-btn').addEventListener('click', () => {
            const searchContainer = document.getElementById('search-container');
            searchContainer.classList.toggle('hidden');
            if (!searchContainer.classList.contains('hidden')) {
                document.getElementById('search-input').focus();
            }
        });

        // Search Filter
        document.getElementById('search-input').addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filtered = globalPlugins.filter(p => p.name.toLowerCase().includes(searchTerm));
            renderPlugins(filtered);
        });

        window.addEventListener('DOMContentLoaded', loadRepository);
    </script>
</body>
</html>
