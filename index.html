    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        body {
            background-color: #0b0f16; color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        
        /* App Container */
        .app-container {
            width: 100%; max-width: 450px; margin: 0 auto;
            background-color: #0b0f16; min-height: 100vh;
            position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.5);
            border-left: 1px solid #1f2937; border-right: 1px solid #1f2937;
            overflow-x: hidden;
        }

        /* Fullscreen Video Fixes */
        :fullscreen .app-container, :-webkit-full-screen .app-container {
            max-width: 100%; border: none; width: 100vw; height: 100vh; overflow: hidden; margin: 0; padding: 0;
        }
        :fullscreen #video-wrapper, :-webkit-full-screen #video-wrapper {
            width: 100vw !important; height: 100vh !important; max-width: 100% !important; border-radius: 0 !important;
        }
        :fullscreen #mainVideo, :-webkit-full-screen #mainVideo {
            width: 100%; height: 100%;
        }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; margin: 0; padding: 0; pointer-events: auto; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 12px; width: 12px; border-radius: 50%;
            background: #00e6e6; cursor: pointer; margin-top: -4px; box-shadow: 0 0 5px rgba(0,230,230,0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer; background: rgba(255, 255, 255, 0.3); border-radius: 2px;
        }
        
        .controls-transition { transition: opacity 0.3s ease; pointer-events: none; }
        .controls-transition.active { pointer-events: auto; }
        .video-contain { object-fit: contain; }
        .video-cover { object-fit: cover; }
        .nav-active { color: #22c55e !important; }

        .snap-x { scroll-snap-type: x mandatory; }
        .snap-center { scroll-snap-align: center; }
    </style>
</head>

        function switchTab(viewId) {
            ['home-view', 'downloads-view', 'player-view'].forEach(id => document.getElementById(id).classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');
            window.scrollTo(0, 0);

            document.getElementById('nav-home').classList.remove('nav-active');
            document.getElementById('nav-downloads').classList.remove('nav-active');
            
            if(viewId === 'home-view') document.getElementById('nav-home').classList.add('nav-active');
            if(viewId === 'downloads-view') {
                document.getElementById('nav-downloads').classList.add('nav-active');

                loadDownloads();
            }
            if(viewId !== 'player-view') { video.pause(); updatePlayPauseUI(false); }
        }

        function openPlayer(id, fromView = 'home-view') {
            previousView = fromView;
            currentActiveItem = contentData.find(item => item.id === id);
            
            document.getElementById('player-title').innerText = currentActiveItem.title;
            document.getElementById('player-rating').innerText = currentActiveItem.rating;
            document.getElementById('player-year').innerText = currentActiveItem.year;
            document.getElementById('player-genre').innerText = currentActiveItem.genre;
            document.getElementById('player-desc').innerText = currentActiveItem.desc || "";
            video.poster = currentActiveItem.poster;

            const kdramaBadge = document.getElementById('player-kdrama-badge');
            if(currentActiveItem.isKDrama) kdramaBadge.classList.remove('hidden');
            else kdramaBadge.classList.add('hidden');

            const epContainer = document.getElementById('episodes-container');
            const epList = document.getElementById('episodes-list');
            epList.innerHTML = '';
            
            if (currentActiveItem.type === "series") {
                epContainer.classList.remove('hidden');
                currentActiveItem.episodes.forEach((ep, index) => {
                    const btnClass = index === 0 ? 'border border-[#00e6e6] text-[#00e6e6] bg-[#00e6e6]/10' : 'bg-[#1c212a] text-gray-400';
                    epList.innerHTML += `<button onclick="playEpisode(${index}, this)" class="ep-btn w-full h-10 rounded text-sm font-medium ${btnClass}">${ep.epNum}</button>`;
                });
            } else {
                epContainer.classList.add('hidden');
            }

            switchTab('player-view');
            playEpisode(0, null);
        }

        function playEpisode(index, btnElement) {
            currentEpIndex = index;
            video.src = currentActiveItem.episodes[index].link;
            video.play();
            updatePlayPauseUI(true);

            if(btnElement) {
                document.querySelectorAll('.ep-btn').forEach(b => b.className = 'ep-btn w-full h-10 rounded text-sm font-medium bg-[#1c212a] text-gray-400');
                btnElement.className = 'ep-btn w-full h-10 rounded text-sm font-medium border border-[#00e6e6] text-[#00e6e6] bg-[#00e6e6]/10';
            }
            let epText = currentActiveItem.type === 'series' ? ` E${currentActiveItem.episodes[index].epNum}` : "";
            document.getElementById('player-title-top').innerText = `${currentActiveItem.title}${epText}`;
        }

        function startDownload() {
            const dlId = `${currentActiveItem.id}_${currentEpIndex}`;
            let downloads = JSON.parse(localStorage.getItem('moviebox_downloads')) || [];
            
            if (downloads.find(dl => dl.dlId === dlId)) {
                showPersistentIndicator('<i class="fa-solid fa-circle-check text-green-500"></i>', 'Already Downloaded');
                return;
            }

            actionIndicator.classList.remove('hidden'); actionIndicator.style.opacity = '1';
            let progress = 0;
            
            const dlInterval = setInterval(() => {
                progress += Math.floor(Math.random() * 20) + 10; 
                if (progress >= 100) {
                    clearInterval(dlInterval);
                    const epText = currentActiveItem.type === 'series' ? ` (Ep ${currentActiveItem.episodes[currentEpIndex].epNum})` : "";
                    downloads.push({
                        dlId: dlId, movieId: currentActiveItem.id, title: currentActiveItem.title + epText,
                        poster: currentActiveItem.poster, link: currentActiveItem.episodes[currentEpIndex].link,
                        size: (Math.random() * 200 + 100).toFixed(1) + " MB"
                    });
                    localStorage.setItem('moviebox_downloads', JSON.stringify(downloads));
                    
                    actionIndicator.innerHTML = `<i class="fa-solid fa-circle-check text-green-400"></i> <span class="text-green-400">Saved Offline!</span>`;
                    document.getElementById('dl-badge').classList.remove('hidden');
                    setTimeout(() => { actionIndicator.style.opacity = '0'; }, 1500);
                } else {
                    actionIndicator.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-[#00e6e6]"></i> <span>Downloading ${progress}%</span>`;
                }
            }, 500);
        }

        function loadDownloads() {
            const dlContainer = document.getElementById('downloaded-items-container');
            let downloads = JSON.parse(localStorage.getItem('moviebox_downloads')) || [];
            
            if (downloads.length === 0) {
                dlContainer.innerHTML = `<div class="flex flex-col items-center justify-center mt-20 text-gray-500"><i class="fa-solid fa-folder-open text-4xl mb-3"></i><p>No offline videos.</p></div>`;
                return;
            }
            dlContainer.innerHTML = '';
            downloads.reverse().forEach(dl => {
                dlContainer.innerHTML += `
                <div class="bg-[#1a1f29] rounded-xl p-3 flex items-center gap-4 mb-3 border border-gray-800 shadow-lg">
                    <div class="relative w-20 aspect-video rounded-lg overflow-hidden shrink-0">
                        <img src="${dl.poster}" class="w-full h-full object-cover">
                        <div class="absolute inset-0 bg-black/40 flex items-center justify-center"><i class="fa-solid fa-play text-white/80"></i></div>
                    </div>
                    <div class="flex-1 overflow-hidden" onclick="openPlayer(${dl.movieId}, 'downloads-view')">
                        <h4 class="font-bold text-sm truncate text-white">${dl.title}</h4>
                        <div class="flex items-center gap-2 text-xs text-gray-400 mt-1">
                            <span class="text-green-500"><i class="fa-solid fa-circle-check"></i> Downloaded</span><span>| ${dl.size}</span>
                        </div>
                    </div>
                    <button onclick="deleteDownload('${dl.dlId}')" class="w-10 h-10 rounded-full bg-red-500/10 text-red-500 flex items-center justify-center hover:bg-red-500 hover:text-white transition"><i class="fa-solid fa-trash-can"></i></button>
                </div>`;
            });
        }

        function deleteDownload(dlId) {
            let downloads = JSON.parse(localStorage.getItem('moviebox_downloads')) || [];
            localStorage.setItem('moviebox_downloads', JSON.stringify(downloads.filter(dl => dl.dlId !== dlId)));

        function shareLink() {
            if (navigator.share) {
                navigator.share({ title: currentActiveItem.title, text: 'Check out this movie!', url: window.location.href }).catch(console.error);

        // --- FIXED FULLSCREEN LOGIC FOR MOBILE LANDSCAPE ---
        async function toggleFullscreen() {
            const wrapper = document.getElementById('video-wrapper');
            
            if (!document.fullscreenElement) {
                // Enter fullscreen
                if (wrapper.requestFullscreen) {
                    await wrapper.requestFullscreen();
                } else if (wrapper.webkitRequestFullscreen) {
                    await wrapper.webkitRequestFullscreen();
                }
                // Try to force landscape orientation if supported by mobile browser
                if (screen.orientation && screen.orientation.lock) {
                    try {
                        await screen.orientation.lock('landscape');
                    } catch (e) {
                        console.log("Screen orientation lock failed or not supported.");
                    }
                }
            } else {
                // Exit fullscreen
                if (document.exitFullscreen) {
                    await document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    await document.webkitExitFullscreen();
                }
                // Unlock orientation back to normal
                if (screen.orientation && screen.orientation.unlock) {
                    screen.orientation.unlock();
                }
            }
        }

        // Listen for fullscreen changes to update the icon
        document.addEventListener('fullscreenchange', () => {
            const icon = document.getElementById('fullscreen-icon');
            if (document.fullscreenElement) {
                icon.className = "fa-solid fa-compress text-lg sm:text-xl drop-shadow";
            } else {
                icon.className = "fa-solid fa-expand text-lg sm:text-xl drop-shadow";
            }
        });

        async function togglePiP() {
            try {
                if (video !== document.pictureInPictureElement) await video.requestPictureInPicture();
                else await document.exitPictureInPicture();

                }, 3000);
            }
        }

        gestureArea.addEventListener('click', (e) => {
            if (e.target.closest('button') || e.target.closest('input')) return;
            
            if (controlsOverlay.style.opacity === '0' || !controlsOverlay.classList.contains('active')) {
                resetControlsTimeout();
            } else {
                clearTimeout(controlsTimeout);
                controlsOverlay.classList.remove('active');
                controlsOverlay.style.opacity = '0';
            }
        });

        let isDragging = false, startX = 0, startY = 0, dragAction = null;
        gestureArea.addEventListener('touchstart', e => {
            if (e.target.closest('button') || e.target.closest('input')) return;
            isDragging = true; dragAction = null;
            startX = e.touches[0].clientX; startY = e.touches[0].clientY;
        }, {passive: true});

        gestureArea.addEventListener('touchmove', e => {
            if(!isDragging) return; 
            const diffX = e.touches[0].clientX - startX;
            if(!dragAction && Math.abs(diffX) > 10) { dragAction = 'seek'; video.pause(); }
            if(dragAction === 'seek') {
                e.preventDefault(); 
                video.currentTime += diffX * 0.1;
            }
        }, {passive: false});

        gestureArea.addEventListener('touchend', e => {
            isDragging = false; 
            if(dragAction === 'seek') {
                video.play();
                updatePlayPauseUI(true);
            }
        });

        video.addEventListener('play', resetControlsTimeout);
        video.addEventListener('pause', () => {
            clearTimeout(controlsTimeout);
            controlsOverlay.classList.add('active');
            controlsOverlay.style.opacity = '1';
        });

        video.addEventListener('timeupdate', () => {
            if(video.duration) {
                document.getElementById('progress-bar').value = (video.currentTime / video.duration) * 100;
                document.getElementById('current-time').innerText = formatTime(video.currentTime);
                document.getElementById('duration-time').innerText = formatTime(video.duration);
            }
        });

        document.getElementById('progress-bar').addEventListener('input', (e) => {
            video.currentTime = (e.target.value / 100) * video.duration;
            resetControlsTimeout();
        });

        function formatTime(s) {
            if (isNaN(s)) return "00:00";
            return `${Math.floor(s/60).toString().padStart(2,'0')}:${Math.floor(s%60).toString().padStart(2,'0')}`;
        }

        window.onload = renderContent;
    </script>
</body>
</html>
