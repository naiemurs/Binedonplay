    <style>
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        body {
            background-color: #0b0f16; color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        
        .app-container {
            width: 100%; max-width: 1280px; margin: 0 auto;
            background-color: #0b0f16; min-height: 100vh;
            position: relative; box-shadow: 0 0 20px rgba(0,0,0,0.5);
            overflow-x: hidden;
        }

        /* Perfect Fullscreen */
        #player-view:fullscreen, #player-view:-webkit-full-screen {
            width: 100vw !important;
            height: 100vh !important;
            max-width: none !important;
            background-color: #000;
        }

        /* Custom Range Slider */
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; pointer-events: auto; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%;
            background: #00e6e6; cursor: pointer; margin-top: -6px; box-shadow: 0 0 8px rgba(0,230,230,0.8);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 4px; cursor: pointer; background: rgba(255, 255, 255, 0.3); border-radius: 2px;
        }
        
        .video-contain { object-fit: contain; }
        .video-cover { object-fit: cover; }
        .nav-active { color: #22c55e !important; }

        .snap-x { scroll-snap-type: x mandatory; }
        .snap-center { scroll-snap-align: center; }
        #hero-carousel { scroll-behavior: smooth; }
        
        /* Prevent Default Scrolling on Video */
        #gesture-layer { touch-action: none; }
        
        /* Hide default video controls */
        video::-webkit-media-controls { display: none !important; }
        video { outline: none; }
    </style>
</head>

                ]
            }
        ];

        let currentActiveItem = null, currentEpIndex = 0, previousView = 'home-view';
        const video = document.getElementById('mainVideo');
        const actionIndicator = document.getElementById('action-indicator');
        const controlsOverlay = document.getElementById('custom-controls');
        const heroCarousel = document.getElementById('hero-carousel');
        let hlsInstance = null;
        let controlsTimeout;
        
        // --- Slider Logic ---
        let slideInterval;
        let currentSlide = 0;
        const totalSlides = 2; 

        function startAutoSlide() {
            clearInterval(slideInterval); 
            slideInterval = setInterval(() => {
                currentSlide++;
                if(currentSlide >= totalSlides) currentSlide = 0;
                heroCarousel.scrollTo({ left: heroCarousel.clientWidth * currentSlide, behavior: 'smooth' });
            }, 3500); 
        }

        heroCarousel.addEventListener('touchstart', () => clearInterval(slideInterval), {passive: true});
        heroCarousel.addEventListener('touchend', startAutoSlide);

        function switchTab(viewId) {
            ['home-view', 'downloads-view', 'player-view'].forEach(id => document.getElementById(id).classList.add('hidden'));
            document.getElementById(viewId).classList.remove('hidden');
            window.scrollTo(0, 0);

            document.getElementById('nav-home').classList.remove('nav-active');
            document.getElementById('nav-downloads').classList.remove('nav-active');
            
            if(viewId === 'home-view') {
                document.getElementById('nav-home').classList.add('nav-active');
                startAutoSlide(); 
            } else {
                clearInterval(slideInterval); 
            }

            if(viewId === 'downloads-view') {
                document.getElementById('nav-downloads').classList.add('nav-active');
                loadDownloads();
            }
            if(viewId !== 'player-view') { 
                video.pause(); 
                if(hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
            }
        }

        function goBack() {
            if (document.fullscreenElement) document.exitFullscreen();
            switchTab(previousView);
        }

        function renderContent() {
            const seriesContainer = document.getElementById('series-list-container');
            seriesContainer.innerHTML = '';
            contentData.forEach((item) => {
                const kdramaBadge = item.isKDrama ? `<div class="absolute top-1 left-1 bg-rose-600/90 backdrop-blur text-[9px] px-1.5 py-0.5 rounded text-white font-bold tracking-wider shadow-md">KDRAMA</div>` : '';
                const cardHTML = `
                <div onclick="openPlayer(${item.id}, 'home-view')" class="relative w-[130px] md:w-[160px] shrink-0 cursor-pointer group">
                    <div class="relative aspect-[2/3] rounded-lg overflow-hidden bg-gray-900">
                        <img src="${item.poster}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
                        ${kdramaBadge}
                    </div>
                    <h3 class="text-sm font-medium mt-2 truncate text-gray-200">${item.title}</h3>
                </div>`;
                seriesContainer.innerHTML += cardHTML;
            });
            loadDownloads();
            startAutoSlide(); 
        }

        function openPlayer(id, fromView = 'home-view') {
            previousView = fromView;
            currentActiveItem = contentData.find(item => item.id === id);
            
            document.getElementById('player-title').innerText = currentActiveItem.title;
            document.getElementById('player-rating').innerText = currentActiveItem.rating;
            document.getElementById('player-year').innerText = currentActiveItem.year;
            document.getElementById('player-genre').innerText = currentActiveItem.genre;
            document.getElementById('player-desc').innerText = currentActiveItem.desc || "";
            video.poster = currentActiveItem.poster;

            const kdramaBadge = document.getElementById('player-kdrama-badge');
            if(currentActiveItem.isKDrama) kdramaBadge.classList.remove('hidden');
            else kdramaBadge.classList.add('hidden');

            const epList = document.getElementById('episodes-list');
            epList.innerHTML = '';
            
            currentActiveItem.episodes.forEach((ep, index) => {
                const btnClass = index === 0 ? 'border border-[#00e6e6] text-[#00e6e6] bg-[#00e6e6]/10' : 'bg-[#1c212a] text-gray-400';
                epList.innerHTML += `<button onclick="playEpisode(${index}, this)" class="ep-btn w-full h-10 px-2 rounded text-sm font-medium ${btnClass} transition truncate">${ep.epNum}</button>`;
            });

            switchTab('player-view');
            playEpisode(0, null);
        }

        // --- HLS.JS PLAYER LOGIC ---
        function playEpisode(index, btnElement) {
            currentEpIndex = index;
            const src = currentActiveItem.episodes[index].link;

            if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }

            // Initialize HLS.js
            if (Hls.isSupported()) {
                hlsInstance = new Hls();
                hlsInstance.loadSource(src);
                hlsInstance.attachMedia(video);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, function() { video.play(); });
                // Fallback if Error
                hlsInstance.on(Hls.Events.ERROR, function (event, data) {
                    if (data.fatal) { video.src = src; video.play(); }
                });
            } else {
                video.src = src;
                video.play();
            }

            if(btnElement) {
                document.querySelectorAll('.ep-btn').forEach(b => b.className = 'ep-btn w-full h-10 px-2 rounded text-sm font-medium bg-[#1c212a] text-gray-400 transition truncate');
                btnElement.className = 'ep-btn w-full h-10 px-2 rounded text-sm font-medium border border-[#00e6e6] text-[#00e6e6] bg-[#00e6e6]/10 transition truncate';
            }
            let epText = ` - ${currentActiveItem.episodes[index].epNum}`;
            document.getElementById('player-title-top').innerText = `${currentActiveItem.title}${epText}`;
            showControls();
        }

        // --- ADVANCED GESTURE SYSTEM ---
        const gestureLayer = document.getElementById('gesture-layer');
        let isDragging = false, dragStartX = 0, dragStartY = 0, startVidTime = 0, startVol = 0, dragType = null;

        function getX(e) { return e.touches ? e.touches[0].clientX : e.clientX; }
        function getY(e) { return e.touches ? e.touches[0].clientY : e.clientY; }

        gestureLayer.addEventListener('touchstart', (e) => {
            isDragging = true; dragType = null;
            dragStartX = getX(e); dragStartY = getY(e);
            startVidTime = video.currentTime; startVol = video.volume;
        }, {passive: true});

        gestureLayer.addEventListener('touchmove', (e) => {
            if(!isDragging) return; 
            const diffX = getX(e) - dragStartX;
            const diffY = getY(e) - dragStartY;

            // Determine if swipe is Horizontal (Seek) or Vertical (Volume)
            if(!dragType) {
                if(Math.abs(diffX) > 20) { dragType = 'seek'; video.pause(); }
                else if (Math.abs(diffY) > 20) { dragType = 'volume'; }
            }

            if(dragType === 'seek') {
                e.preventDefault(); 
                let newTime = startVidTime + (diffX * 0.3); // 0.3 sensitivity
                newTime = Math.max(0, Math.min(video.duration || 0, newTime));
                video.currentTime = newTime;
                showIndicator('<i class="fa-solid fa-clock"></i>', formatTime(newTime));
            } else if (dragType === 'volume') {
                e.preventDefault();
                let newVol = startVol - (diffY / 200); // Swipe up (negative Y) increases volume
                newVol = Math.max(0, Math.min(1, newVol));
                video.volume = newVol;
                showIndicator('<i class="fa-solid fa-volume-high"></i>', Math.round(newVol * 100) + '%');
            }
        }, {passive: false});

        gestureLayer.addEventListener('touchend', (e) => {
            isDragging = false; 
            actionIndicator.classList.add('hidden');
            if(dragType === 'seek') { 
                video.play(); 
            } else if (!dragType) {
                // Was just a tap
                if (controlsOverlay.style.opacity === '0') showControls();
                else hideControls();
            }
            dragType = null;
        });

        // PC Mouse Support
        gestureLayer.addEventListener('mousedown', (e) => {
            isDragging = true; dragType = null;
            dragStartX = getX(e); dragStartY = getY(e);
            startVidTime = video.currentTime; startVol = video.volume;
        });
        gestureLayer.addEventListener('mousemove', (e) => {
            if(!isDragging) return; 
            const diffX = getX(e) - dragStartX;
            const diffY = getY(e) - dragStartY;
            if(!dragType) {
                if(Math.abs(diffX) > 20) { dragType = 'seek'; video.pause(); }
                else if (Math.abs(diffY) > 20) { dragType = 'volume'; }
            }
            if(dragType === 'seek') {
                let newTime = startVidTime + (diffX * 0.3); 
                newTime = Math.max(0, Math.min(video.duration || 0, newTime));
                video.currentTime = newTime;
                showIndicator('<i class="fa-solid fa-clock"></i>', formatTime(newTime));
            } else if (dragType === 'volume') {
                let newVol = startVol - (diffY / 200); 
                newVol = Math.max(0, Math.min(1, newVol));
                video.volume = newVol;
                showIndicator('<i class="fa-solid fa-volume-high"></i>', Math.round(newVol * 100) + '%');
            }
        });
        gestureLayer.addEventListener('mouseup', () => {
            isDragging = false; actionIndicator.classList.add('hidden');
            if(dragType === 'seek') video.play();
            else if (!dragType) { controlsOverlay.style.opacity === '0' ? showControls() : hideControls(); }
            dragType = null;
        });

        function showIndicator(iconHtml, text) {
            actionIndicator.innerHTML = `${iconHtml} <span>${text}</span>`;
            actionIndicator.classList.remove('hidden'); 
        }

        // --- UI & BUTTONS ---
        function togglePlay() { video.paused ? video.play() : video.pause(); showControls(); }
        
        function updatePlayPauseUI(isPlaying) {
            document.getElementById('center-play-icon').className = isPlaying ? "hidden" : "fa-solid fa-play text-6xl md:text-7xl opacity-90 hover:opacity-100";
            document.getElementById('bottom-play-icon').className = isPlaying ? "fa-solid fa-pause" : "fa-solid fa-play";
        }

        function toggleStretch() {
            video.classList.toggle('video-contain'); 
            video.classList.toggle('video-cover');
            document.getElementById('stretch-icon').className = video.classList.contains('video-cover') ? "fa-solid fa-compress" : "fa-solid fa-expand";
        }

        function toggleFullscreen() {
            const playerView = document.getElementById('player-view');
            if (!document.fullscreenElement) {
                playerView.requestFullscreen().catch(err => console.log(err));
            } else {
                document.exitFullscreen();
            }
        }

        // Handle Fullscreen UI updates
        document.addEventListener('fullscreenchange', () => {
            const icon = document.getElementById('fullscreen-icon');
            icon.className = document.fullscreenElement ? "fa-solid fa-compress" : "fa-solid fa-expand";
        });

        function showControls() {
            clearTimeout(controlsTimeout);
            controlsOverlay.style.opacity = '1';
            controlsOverlay.classList.remove('pointer-events-none');
            if (!video.paused) {
                controlsTimeout = setTimeout(hideControls, 3000);
            }
        }
        function hideControls() {
            if(!video.paused) {
                controlsOverlay.style.opacity = '0';
                controlsOverlay.classList.add('pointer-events-none');
            }
        }

        // Video Events
        video.addEventListener('play', () => { updatePlayPauseUI(true); showControls(); });
        video.addEventListener('pause', () => { updatePlayPauseUI(false); showControls(); });
        video.addEventListener('timeupdate', () => {
            if(video.duration) {
                document.getElementById('progress-bar').value = (video.currentTime / video.duration) * 100;
                document.getElementById('current-time').innerText = formatTime(video.currentTime);
                document.getElementById('duration-time').innerText = formatTime(video.duration);
            }
        });

        document.getElementById('progress-bar').addEventListener('input', (e) => {
            video.currentTime = (e.target.value / 100) * video.duration;
            showControls();
        });

        function formatTime(s) {
            if (isNaN(s)) return "00:00";
            return `${Math.floor(s/60).toString().padStart(2,'0')}:${Math.floor(s%60).toString().padStart(2,'0')}`;
        }

        // Download System
        function startDownload() {
            const dlId = `${currentActiveItem.id}_${currentEpIndex}`;
            let downloads = JSON.parse(localStorage.getItem('moviebox_downloads')) || [];
            if (downloads.find(dl => dl.dlId === dlId)) { alert('Already Downloaded!'); return; }
            downloads.push({
                dlId: dlId, movieId: currentActiveItem.id, title: currentActiveItem.title,
                poster: currentActiveItem.poster, link: currentActiveItem.episodes[currentEpIndex].link, size: "450 MB"
            });
            localStorage.setItem('moviebox_downloads', JSON.stringify(downloads));
            alert('Saved to Downloads!');
            document.getElementById('dl-badge').classList.remove('hidden');
        }

        function loadDownloads() {
            const dlContainer = document.getElementById('downloaded-items-container');
            let downloads = JSON.parse(localStorage.getItem('moviebox_downloads')) || [];
            if (downloads.length === 0) {
                dlContainer.innerHTML = `<p class="text-center text-gray-500 mt-10">No offline videos.</p>`;
                return;
            }
            dlContainer.innerHTML = '';
            downloads.reverse().forEach(dl => {
                dlContainer.innerHTML += `
                <div class="bg-[#1a1f29] rounded-xl p-3 flex items-center gap-4 border border-gray-800 shadow-lg">
                    <img src="${dl.poster}" class="w-20 h-14 rounded-lg object-cover">
                    <div class="flex-1 overflow-hidden" onclick="openPlayer(${dl.movieId}, 'downloads-view')">
                        <h4 class="font-bold text-sm text-white truncate">${dl.title}</h4>
                        <p class="text-xs text-green-500 mt-1">Downloaded</p>
                    </div>
                </div>`;
            });
        }

        window.onload = renderContent;
    </script>
</body>
</html>
